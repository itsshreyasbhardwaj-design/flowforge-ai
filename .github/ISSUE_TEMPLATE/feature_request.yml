name: Feature request
description: Suggest a capability or improvement
labels: ['enhancement', 'needs triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that FlowForge makes hard or impossible? Describe the situation, not the solution.
      placeholder: I need to fan a workflow out over 10k rows, but Loop materialises the whole result array in memory.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough sketches and API shapes are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What have you tried, and why did it fall short?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New node type
        - Execution engine
        - Canvas / editor
        - Evaluation
        - Observability
        - Deployment
        - Plugin SDK
        - Provider integration
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to implement this
        - label: This can be built as a third-party plugin rather than a core change
